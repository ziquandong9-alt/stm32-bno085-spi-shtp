name: Portable driver tests

on:
  push:
  pull_request:

jobs:
  cmake-and-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBNO085_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen
      - name: Configure documentation
        run: cmake -S . -B build-docs -DBNO085_BUILD_TESTS=OFF -DBNO085_BUILD_DOCS=ON
      - name: Generate documentation
        run: cmake --build build-docs --target docs
      - uses: actions/upload-artifact@v4
        with:
          name: bno085-api-docs
          path: build-docs/docs/html
