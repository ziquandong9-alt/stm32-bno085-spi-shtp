name: Portable driver tests

on:
  push:
  pull_request:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build parser regression tests
        run: >-
          gcc -std=c11 -Wall -Wextra -Werror
          -IBNO085_Driver/Inc -IBNO085_Driver/Port
          tests/test_bno085_parser.c -lm -o tests/test_bno085_parser
      - name: Run parser regression tests
        run: ./tests/test_bno085_parser
